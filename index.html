
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sport TV - Live Channels</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #080b12;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    height: 60px;
    background: #111827;
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 0 15px;
    border-bottom: 1px solid #263244;
    position: relative;
    z-index: 20;
}

.logo {
    color: #ef4444;
    font-size: 21px;
    font-weight: bold;
}

.logo span {
    color: white;
}

.menu-btn {
    background: #263244;
    color: white;
    border: none;
    padding: 9px 13px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 20px;
}

.header-right {
    margin-left: auto;
    color: #94a3b8;
    font-size: 11px;
}

.container {
    display: flex;
    width: 100%;
    height: calc(100% - 60px);
    position: relative;
}

/* SIDEBAR */

.sidebar {
    width: 240px;
    flex-shrink: 0;
    background: #111827;
    padding: 15px 10px;
    overflow-y: auto;
    transition: width .25s ease, padding .25s ease;
}

.sidebar h3 {
    color: #94a3b8;
    font-size: 12px;
    margin: 10px 10px 15px;
    text-transform: uppercase;
}

.channel {
    display: flex;
    align-items: center;
    width: 100%;
    padding: 13px 12px;
    margin-bottom: 5px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: #cbd5e1;
    text-align: left;
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
}

.channel:hover {
    background: #263244;
}

.channel.active {
    background: #dc2626;
    color: white;
    font-weight: bold;
}

.dot {
    width: 8px;
    height: 8px;
    background: #64748b;
    border-radius: 50%;
    margin-right: 12px;
    flex-shrink: 0;
}

.channel.active .dot {
    background: white;
}

/* MAIN PLAYER */

.main {
    flex: 1;
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding: 15px;
}

.player-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    flex-shrink: 0;
}

.player-header h2 {
    font-size: 18px;
}

.live {
    color: #ef4444;
    font-size: 12px;
    font-weight: bold;
}

.player {
    flex: 1;
    min-height: 0;
    background: black;
    border-radius: 8px;
    overflow: hidden;
}

.player iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
}

.controls {
    display: flex;
    justify-content: flex-end;
    margin-top: 10px;
    flex-shrink: 0;
}

.controls button {
    background: #dc2626;
    color: white;
    border: 0;
    padding: 11px 18px;
    border-radius: 6px;
    cursor: pointer;
}

/* DESKTOP CLOSED */

.container.sidebar-hidden .sidebar {
    width: 0;
    padding-left: 0;
    padding-right: 0;
    overflow: hidden;
}

/* MOBILE */

.overlay {
    display: none;
}

@media (max-width: 768px) {

    header {
        height: 55px;
    }

    .container {
        height: calc(100% - 55px);
        display: block;
    }

    .main {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        padding: 10px;
    }

    .player-header h2 {
        font-size: 16px;
    }

    .sidebar {
        position: absolute;
        z-index: 15;
        top: 0;
        bottom: 0;
        left: 0;
        width: min(280px, 85vw);
        padding: 15px 10px;
        overflow-y: auto;
        overflow-x: hidden;
        transform: translateX(0);
        transition: transform .25s ease;
        box-shadow: 5px 0 20px rgba(0,0,0,.4);
    }

    .sidebar h3 {
        display: block;
    }

    .channel {
        min-height: 46px;
    }

    .container.sidebar-hidden .sidebar {
        width: min(280px, 85vw);
        padding: 15px 10px;
        transform: translateX(-105%);
    }

    .overlay {
        display: block;
        position: absolute;
        z-index: 10;
        inset: 0;
        background: rgba(0,0,0,.65);
        opacity: 1;
        visibility: visible;
        transition: opacity .25s, visibility .25s;
    }

    .container.sidebar-hidden .overlay {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
    }

    .container:not(.sidebar-hidden) .main {
        pointer-events: none;
    }

    .container:not(.sidebar-hidden) .player {
        pointer-events: none;
    }

    .container:not(.sidebar-hidden) .controls {
        pointer-events: none;
    }

    .container:not(.sidebar-hidden) .player-header {
        pointer-events: none;
    }

    .controls button {
        padding: 10px 14px;
    }
}
</style>
</head>

<body>

<header>
    <button class="menu-btn" id="menuButton"
        onclick="toggleSidebar()">☰</button>

    <div class="logo">SPORT <span>TV</span></div>

    <div class="header-right">LIVE CHANNELS</div>
</header>

<div class="container" id="container">

    <div class="overlay" id="overlay"
        onclick="closeSidebar()"></div>

    <aside class="sidebar" id="sidebar">
        <h3>Available Channels</h3>
        <div id="channelList"></div>
    </aside>

    <main class="main">

        <div class="player-header">
            <h2 id="channelTitle">Sport TV 1</h2>
            <span class="live">● LIVE</span>
        </div>

        <div class="player" id="player">
            <iframe id="stream"
                src="https://thedaddy.li/player/stream-49.php"
                allowfullscreen>
            </iframe>
        </div>

        <div class="controls">
            <button onclick="fullscreen()">⛶ Fullscreen</button>
        </div>

    </main>
</div>

<script>

const channels = [
    ["Sport TV 1","https://thedaddy.li/player/stream-49.php"],
    ["Sport TV 2","https://thedaddy.li/player/stream-74.php"],
    ["Sport TV 3","https://thedaddy.li/player/stream-454.php"],
    ["Sport TV 4","https://thedaddy.li/player/stream-289.php"],
    ["Sport TV 5","https://thedaddy.li/player/stream-290.php"],
    ["Sport TV 6","https://thedaddy.li/player/stream-291.php"],
    ["Canal 11","https://thedaddy.li/player/stream-540.php"],
    ["DAZN 1","https://thedaddy.li/player/stream-455.php"],
    ["DAZN 2","https://thedaddy.li/player/stream-456.php"],
    ["DAZN 3","https://thedaddy.li/player/stream-457.php"],
    ["DAZN 4","https://thedaddy.li/player/stream-458.php"],
    ["DAZN 5","https://thedaddy.li/player/stream-459.php"],
    ["Benfica TV","https://thedaddy.li/player/stream-380.php"],
    ["Sporting TV","https://thedaddy.li/player/stream-716.php"]
];

const container = document.getElementById("container");
const stream = document.getElementById("stream");
const title = document.getElementById("channelTitle");
const list = document.getElementById("channelList");
const menuButton = document.getElementById("menuButton");

function loadChannel(index) {
    title.textContent = channels[index][0];
    stream.src = channels[index][1];

    document.querySelectorAll(".channel").forEach((btn, i) => {
        btn.classList.toggle("active", i === index);
    });

    if (window.innerWidth <= 768) {
        closeSidebar();
    }
}

channels.forEach((channel, index) => {
    const button = document.createElement("button");
    button.className = "channel" + (index === 0 ? " active" : "");

    const dot = document.createElement("span");
    dot.className = "dot";

    button.appendChild(dot);
    button.appendChild(document.createTextNode(channel[0]));

    button.onclick = () => loadChannel(index);

    list.appendChild(button);
});

function toggleSidebar() {
    container.classList.toggle("sidebar-hidden");
    updateMenuButton();
}

function closeSidebar() {
    container.classList.add("sidebar-hidden");
    updateMenuButton();
}

function updateMenuButton() {
    menuButton.textContent =
        container.classList.contains("sidebar-hidden") ? "☰" : "✕";
}

function fullscreen() {
    const player = document.getElementById("player");

    if (player.requestFullscreen) {
        player.requestFullscreen();
    } else if (player.webkitRequestFullscreen) {
        player.webkitRequestFullscreen();
    }
}

// Start with sidebar open on desktop and closed on mobile.
function initializeLayout() {
    if (window.innerWidth <= 768) {
        closeSidebar();
    } else {
        container.classList.remove("sidebar-hidden");
        updateMenuButton();
    }
}

initializeLayout();

window.addEventListener("resize", initializeLayout);

</script>

</body>
</html>
